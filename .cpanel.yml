---
deployment:
  tasks:
    - /bin/mkdir -p $HOME/public_html/assets
    - /bin/cp index.html $HOME/public_html/
    - /bin/cp service.html $HOME/public_html/
    - /bin/cp styles.css $HOME/public_html/
    - /bin/cp main.js $HOME/public_html/
    - /bin/cp send.php $HOME/public_html/
    - /bin/cp favicon.svg $HOME/public_html/
    - /bin/cp -R assets/. $HOME/public_html/assets/
